<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Smart Seat Dashboard</title>

  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: #111;
      color: white;
    }

    canvas {
      margin: 20px;
      background: #222;
      border-radius: 15px;
    }

    #status {
      font-size: 24px;
      margin-top: 20px;
      font-weight: bold;
    }

    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 250px;
    }

    th, td {
      border: 1px solid #444;
      padding: 10px;
    }

    th {
      background: #333;
    }

    td {
      background: #222;
    }
  </style>
</head>

<body>

<h1>🔥 智慧坐墊監測系統</h1>

<canvas id="heatmap" width="300" height="300"></canvas>

<canvas id="chart" width="400" height="200"></canvas>

<div id="status">姿勢：偵測中...</div>

<h2>📊 感測器數值</h2>
<table>
  <tr>
    <th>Sensor</th>
    <th>Value</th>
  </tr>
  <tr><td>S1</td><td id="s1">0</td></tr>
  <tr><td>S2</td><td id="s2">0</td></tr>
  <tr><td>S3</td><td id="s3">0</td></tr>
  <tr><td>S4</td><td id="s4">0</td></tr>
</table>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

// Firebase 設定
const firebaseConfig = {
  apiKey: "AIzaSyDItFT-vVfJ4lKKRbF-WijBkQ4UrNdnCkI",
  authDomain: "pressure-seat.firebaseapp.com",
  databaseURL: "https://pressure-seat-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "pressure-seat",
  storageBucket: "pressure-seat.firebasestorage.app",
  messagingSenderId: "602813431828",
  appId: "1:602813431828:web:e2199a92f3c09a66d96701"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const seatRef = db.ref("seat");


// ===== 1. Heatmap (7色階調整) =====
const canvas = document.getElementById("heatmap");
const ctx = canvas.getContext("2d");

function getColor(value) {
  if (value < 666)  return "rgb(255, 0, 0)";       // 紅色 (0~665)
  if (value < 1333) return "rgb(255, 165, 0)";     // 橙色 (666~1332)
  if (value < 1999) return "rgb(255, 255, 0)";     // 黃色 (1333~1998)
  if (value < 2665) return "rgb(0, 128, 0)";       // 綠色 (1999~2664)
  if (value < 3331) return "rgb(0, 0, 255)";       // 藍色 (2665~3330)
  if (value < 4000) return "rgb(75, 0, 130)";      // 靛色 (3331~3999)
  return "rgb(128, 0, 128);";                      // 紫色 (4000以上)
}

function drawHeatmap(data) {
  ctx.clearRect(0, 0, 300, 300);

  // 四個感測器位置
  const pos = [
    [100, 100], // S1
    [200, 100], // S2
    [100, 200], // S3
    [200, 200]  // S4
  ];

  for (let i = 0; i < 4; i++) {
    let val = data[`sensor${i+1}`] !== undefined ? data[`sensor${i+1}`] : 0;
    let [x, y] = pos[i];

    let g = ctx.createRadialGradient(x, y, 10, x, y, 70);
    g.addColorStop(0, getColor(val));
    g.addColorStop(1, "transparent");

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, 70, 0, Math.PI * 2);
    ctx.fill();
  }
}


// ===== 2. Chart.js (縱座標改為 0~4000) =====
const chartData = {
  labels: [],
  datasets: Array.from({length: 4}, (_, i) => ({
    label: `S${i+1}`,
    data: [],
    borderWidth: 2,
    tension: 0.3
  }))
};

const chart = new Chart(document.getElementById("chart"), {
  type: "line",
  data: chartData,
  options: {
    animation: false,
    scales: {
      y: {
        min: 0,
        max: 4000 // 修改此處：縱座標上限調整為 4000
      }
    }
  }
});


// ===== 表格更新 =====
function colorize(id, value) {
  let el = document.getElementById(id);
  // 因應數值改到 4000，稍微調整一下文字顏色級距提示（可依需求自行修改）
  if (value > 2665) {
    el.style.color = "red";
  } else if (value > 1333) {
    el.style.color = "orange";
  } else {
    el.style.color = "lightgreen";
  }
}

function updateTable(data) {
  for (let i = 1; i <= 4; i++) {
    let val = data[`sensor${i}`] !== undefined ? data[`sensor${i}`] : 0;
    document.getElementById(`s${i}`).innerText = val;
    colorize(`s${i}`, val);
  }
}


// ===== 3. 坐姿判定邏輯升級 =====
// 輔助函式：判斷數值是否在目標值 +/- 誤差範圍內
function inRange(val, target, tolerance) {
  return val >= (target - tolerance) && val <= (target + tolerance);
}

function checkPosture(data) {
  const s1 = data.sensor1 !== undefined ? data.sensor1 : 0;
  const s2 = data.sensor2 !== undefined ? data.sensor2 : 0;
  const s3 = data.sensor3 !== undefined ? data.sensor3 : 0;
  const s4 = data.sensor4 !== undefined ? data.sensor4 : 0;

  let status = document.getElementById("status");

  // 條件 A：良好坐姿
  const isGood = inRange(s1, 1200, 200) && 
                 inRange(s2, 2300, 250) && 
                 inRange(s3, 1200, 200) && 
                 inRange(s4, 2300, 250);

  // 條件 B：翹二郎腿
  const isCrossedLegs = inRange(s1, 0, 100) && 
                        inRange(s2, 3500, 500) && 
                        inRange(s3, 600, 200) && 
                        inRange(s4, 1800, 200);

  // 條件 C：重心前移
  const isLeanForward = inRange(s1, 1700, 200) && 
                        inRange(s2, 1700, 200) && 
                        inRange(s3, 1700, 200) && 
                        inRange(s4, 1700, 200);

  if (isGood) {
    status.innerText = "姿勢：良好坐姿 ✅";
    status.style.color = "lightgreen";
  } else if (isCrossedLegs) {
    status.innerText = "姿勢：翹二郎腿 ⚠️";
    status.style.color = "orange";
  } else if (isLeanForward) {
    status.innerText = "姿勢：重心前移 ⚠️";
    status.style.color = "cyan";
  } else {
    status.innerText = "姿勢：其他/歪斜 ❌";
    status.style.color = "red";
  }
}


// ===== Firebase 即時更新 =====
seatRef.on("value", (snap) => {
  const data = snap.val();
  if (!data) return;

  drawHeatmap(data);
  updateTable(data);
  checkPosture(data);

  // 更新圖表 (只要 Firebase 有觸發，即使數值為 0 也會持續在時間軸更新)
  let now = new Date().toLocaleTimeString();
  chart.data.labels.push(now);

  for (let i = 0; i < 4; i++) {
    let val = data[`sensor${i+1}`] !== undefined ? data[`sensor${i+1}`] : 0;
    chart.data.datasets[i].data.push(val);
  }

  // 最多保留 20 筆歷史紀錄
  if (chart.data.labels.length > 20) {
    chart.data.labels.shift();
    chart.data.datasets.forEach(d => d.data.shift());
  }

  chart.update();
});

</script>

</body>
</html>
