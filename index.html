<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Smart Seat Dashboard</title>

  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: #111;
      color: white;
    }

    canvas {
      margin: 20px;
      background: #222;
      border-radius: 15px;
    }

    #status {
      font-size: 24px;
      margin-top: 20px;
      font-weight: bold;
    }

    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 250px;
    }

    th,
    td {
      border: 1px solid #444;
      padding: 10px;
    }

    th {
      background: #333;
    }

    td {
      background: #222;
    }
  </style>
</head>

<body>

  <h1>🔥 智慧坐墊監測系統</h1>

  <!-- 熱力圖 -->
  <canvas id="heatmap" width="300" height="300"></canvas>

  <!-- 折線圖 -->
  <canvas id="chart" width="400" height="200"></canvas>

  <!-- 姿勢狀態 -->
  <div id="status">姿勢：偵測中...</div>

  <!-- 表格 -->
  <h2>📊 感測器數值</h2>

  <table>
    <tr>
      <th>Sensor</th>
      <th>Value</th>
    </tr>

    <tr>
      <td>S1</td>
      <td id="s1">0</td>
    </tr>

    <tr>
      <td>S2</td>
      <td id="s2">0</td>
    </tr>

    <tr>
      <td>S3</td>
      <td id="s3">0</td>
    </tr>

    <tr>
      <td>S4</td>
      <td id="s4">0</td>
    </tr>
  </table>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>

    // ===== Firebase 設定 =====
    const firebaseConfig = {
      apiKey: "AIzaSyDItFT-vVfJ4lKKRbF-WijBkQ4UrNdnCkI",
      authDomain: "pressure-seat.firebaseapp.com",
      databaseURL: "https://pressure-seat-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "pressure-seat",
      storageBucket: "pressure-seat.firebasestorage.app",
      messagingSenderId: "602813431828",
      appId: "1:602813431828:web:e2199a92f3c09a66d96701"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.database();
    const seatRef = db.ref("seat");

    // ===== 最新感測資料 =====
    let latestData = {
      sensor1: 0,
      sensor2: 0,
      sensor3: 0,
      sensor4: 0
    };

    // ===== 久坐提醒 =====
    let sittingStartTime = null;

    // ===== 聲音冷卻 =====
    let lastAlertTime = 0;

    // ===== 聲音提醒 =====
    function playAlert() {

      let now = Date.now();

      // 防止一直狂叫（10秒冷卻）
      if (now - lastAlertTime < 10000) return;

      lastAlertTime = now;

      const audioCtx = new(window.AudioContext || window.webkitAudioContext)();

      const oscillator = audioCtx.createOscillator();

      const gainNode = audioCtx.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.type = "sine";

      oscillator.frequency.setValueAtTime(
        800,
        audioCtx.currentTime
      );

      oscillator.start();

      gainNode.gain.exponentialRampToValueAtTime(
        0.0001,
        audioCtx.currentTime + 1
      );

      oscillator.stop(audioCtx.currentTime + 1);
    }

    // ===== Heatmap =====
    const canvas = document.getElementById("heatmap");

    const ctx = canvas.getContext("2d");

    // ===== 顏色判斷 =====
    function getColor(value) {

      if (value < 666) {
        return "red";
      }

      else if (value < 1333) {
        return "orange";
      }

      else if (value < 1999) {
        return "yellow";
      }

      else if (value < 2665) {
        return "green";
      }

      else if (value < 3331) {
        return "blue";
      }

      else if (value < 4000) {
        return "indigo";
      }

      else {
        return "violet";
      }
    }

    // ===== 畫熱力圖 =====
    function drawHeatmap(data) {

      // 整個背景設成紅色
      ctx.fillStyle = "red";

      ctx.fillRect(0, 0, 300, 300);

      // 四個感測器位置
      const pos = [
        [100, 100],
        [200, 100],
        [100, 200],
        [200, 200]
      ];

      for (let i = 0; i < 4; i++) {

        let val = data[`sensor${i + 1}`] || 0;

        let [x, y] = pos[i];

        let color = getColor(val);

        // 建立漸層
        let gradient = ctx.createRadialGradient(
          x, y, 10,
          x, y, 90
        );

        gradient.addColorStop(0, color);

        gradient.addColorStop(1, "rgba(255,0,0,0)");

        // 畫熱區
        ctx.fillStyle = gradient;

        ctx.beginPath();

        ctx.arc(x, y, 90, 0, Math.PI * 2);

        ctx.fill();

        // 中心圓
        ctx.beginPath();

        ctx.fillStyle = color;

        ctx.arc(x, y, 18, 0, Math.PI * 2);

        ctx.fill();

        // 顯示數值
        ctx.fillStyle = "white";

        ctx.font = "bold 16px Arial";

        ctx.textAlign = "center";

        ctx.fillText(val, x, y + 5);
      }
    }

    // ===== 折線圖 =====
    const chartData = {

      labels: [],

      datasets: Array.from({ length: 4 }, (_, i) => ({

        label: `S${i + 1}`,

        data: [],

        borderWidth: 2,

        tension: 0.3

      }))
    };

    const chart = new Chart(
      document.getElementById("chart"),
      {

        type: "line",

        data: chartData,

        options: {

          animation: false,

          scales: {

            y: {
              min: 0,
              max: 4000
            }
          }
        }
      }
    );

    // ===== 表格顏色 =====
    function colorize(id, value) {

      let el = document.getElementById(id);

      if (value > 3000) {
        el.style.color = "violet";
      }

      else if (value > 2000) {
        el.style.color = "blue";
      }

      else if (value > 1000) {
        el.style.color = "yellow";
      }

      else {
        el.style.color = "lightgreen";
      }
    }

    // ===== 更新表格 =====
    function updateTable(data) {

      for (let i = 1; i <= 4; i++) {

        let val = data[`sensor${i}`] || 0;

        document.getElementById(`s${i}`).innerText = val;

        colorize(`s${i}`, val);
      }
    }

    // ===== 範圍判定 =====
    function inRange(value, target, tolerance) {

      return Math.abs(value - target)
        <= tolerance;
    }

    // ===== 姿勢判定 =====
    function checkPosture(data) {

      let s1 = data.sensor1 || 0;
      let s2 = data.sensor2 || 0;
      let s3 = data.sensor3 || 0;
      let s4 = data.sensor4 || 0;

      let status = document.getElementById("status");

      // ===== 良好坐姿 =====
      let good =

        inRange(s1, 1200, 200) &&
        inRange(s2, 2300, 250) &&
        inRange(s3, 1200, 200) &&
        inRange(s4, 2300, 250);

      // ===== 翹二郎腿 =====
      let crossLeg =

        inRange(s1, 0, 100) &&
        inRange(s2, 3500, 500) &&
        inRange(s3, 600, 200) &&
        inRange(s4, 1800, 200);

      // ===== 重心前移 =====
      let forward =

        inRange(s1, 1700, 200) &&
        inRange(s2, 1700, 200) &&
        inRange(s3, 1700, 200) &&
        inRange(s4, 1700, 200);

      // ===== 是否有人坐著 =====
      let total = s1 + s2 + s3 + s4;

      let sitting = total > 1000;

      // ===== 久坐提醒 =====
      if (sitting) {

        if (!sittingStartTime) {

          sittingStartTime = Date.now();
        }

        let sittingMinutes =

          (Date.now() - sittingStartTime)
          / 1000 / 60;

        // 超過30分鐘
        if (sittingMinutes >= 30) {

          status.innerText =
            "⚠️ 久坐超過30分鐘，請起身活動";

          status.style.color = "orange";

          playAlert();

          return;
        }
      }

      else {

        sittingStartTime = null;
      }

      // ===== 姿勢判定 =====
      if (good) {

        status.innerText =
          "姿勢：良好坐姿 ✅";

        status.style.color =
          "lightgreen";
      }

      else if (crossLeg) {

        status.innerText =
          "姿勢：翹二郎腿 ⚠️";

        status.style.color =
          "orange";

        playAlert();
      }

      else if (forward) {

        status.innerText =
          "姿勢：重心前移 ⚠️";

        status.style.color =
          "yellow";

        playAlert();
      }

      else {

        status.innerText =
          "姿勢：未知姿勢 ❓";

        status.style.color =
          "red";

        playAlert();
      }
    }

    // ===== Firebase 即時更新 =====
    seatRef.on("value", (snap) => {

      const data = snap.val();

      if (!data) return;

      latestData = data;

      drawHeatmap(data);

      updateTable(data);

      checkPosture(data);
    });

    // ===== 每秒更新折線圖 =====
    setInterval(() => {

      let now =
        new Date().toLocaleTimeString();

      chart.data.labels.push(now);

      for (let i = 0; i < 4; i++) {

        chart.data.datasets[i].data.push(

          latestData[`sensor${i + 1}`] || 0
        );
      }

      // 最多保留20筆
      if (chart.data.labels.length > 20) {

        chart.data.labels.shift();

        chart.data.datasets.forEach(d =>
          d.data.shift()
        );
      }

      chart.update();

    }, 1000);

  </script>

</body>

</html>
